name: OTA Update Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  FIRMWARE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # PHASE 1: Verify & Test (runs on every push)
  # ============================================
  verify-and-test:
    name: Verify and Test
    runs-on: ubuntu-latest
    outputs:
      test_passed: ${{ steps.test.outputs.passed }}
      build_artifact: ${{ steps.build.outputs.artifact }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pycodestyle cryptography

      - name: Lint Python code
        run: |
          pycodestyle update_server.py main.py 2>/dev/null || echo "Lint warnings (non-fatal)"

      - name: Run unit tests
        id: test
        run: |
          pytest tests/ -v --tb=short || true
          if [ -f "tests/test_results.txt" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build firmware package
        id: build
        run: |
          mkdir -p dist/firmware
          cp main.py dist/firmware/update.py
          echo "${{ env.FIRMWARE_VERSION }}" > dist/firmware/VERSION
          tar -czf dist/firmware-package.tar.gz -C dist firmware/
          echo "artifact=firmware-package.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.FIRMWARE_VERSION }}
          path: dist/firmware-package.tar.gz

  # ============================================
  # PHASE 2: Deploy (runs on tag creation only)
  # ============================================
  deploy:
    name: Deploy OTA Update
    runs-on: ubuntu-latest
    needs: verify-and-test
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}
          path: dist/firmware

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install signing dependencies
        run: |
          pip install cryptography boto3

      - name: Generate deployment manifest
        run: |
          cat > dist/deployment-manifest.json << EOF
          {
            "version": "${{ github.ref_name }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "firmware_size": $(stat -c%s dist/firmware/update.py),
            "files": ["update.py", "VERSION"]
          }
          EOF

      - name: Sign firmware update
        id: sign
        run: |
          # Load private key from secrets (stored in GitHub Secrets)
          echo "${{ secrets.FIRMWARE_SIGNING_KEY }}" > signing.key

          # Create signature
          python << 'PYTHON_SCRIPT'
          import hashlib
          import base64
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          # Load private key
          with open("signing.key", "rb") as f:
              private_key = serialization.load_pem_private_key(f.read(), password=None)

          # Sign firmware file
          with open("dist/firmware/update.py", "rb") as f:
              firmware_data = f.read()

          signature = private_key.sign(
              firmware_data,
              padding.PKCS1v15(),
              hashes.SHA256()
          )

          # Save signature
          with open("dist/firmware/update.py.sig", "wb") as f:
              f.write(base64.b64encode(signature))

          print("Firmware signed successfully")
          PYTHON_SCRIPT

          echo "signed=true" >> $GITHUB_OUTPUT

      - name: Deploy to S3 (AWS)
        if: env.AWS_BUCKET_NAME != ''
        uses: aws-actions/aws-s3-sync@v1
        with:
          aws-region: us-east-1
          source: dist/firmware/
          s3-folder: ${{ secrets.AWS_S3_PATH }}/firmware/${{ github.ref_name }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy to HTTP server
        if: env.HTTP_SERVER_URL != ''
        run: |
          # Upload firmware to your OTA server via API
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOYMENT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"version\": \"${{ github.ref_name }}\", \"files\": [\"update.py\"]}" \
            ${{ secrets.HTTP_SERVER_URL }}/deploy

          # Upload firmware files
          curl -T dist/firmware/update.py \
            ${{ secrets.HTTP_SERVER_URL }}/firmware/update.py

          curl -T dist/firmware/VERSION \
            ${{ secrets.HTTP_SERVER_URL }}/firmware/VERSION

      - name: Send deployment notification
        run: |
          # Notify team via webhook (Slack, Discord, etc.)
          cat > deploy-notification.json << EOF
          {
            "text": "OTA Update Deployed",
            "attachments": [
              {
                "color": "good",
                "fields": [
                  {"title": "Version", "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Repository", "value": "${{ github.repository }}", "short": true},
                  {"title": "Status", "value": "SUCCESS", "short": true}
                ]
              }
            ]
          }
          EOF

          curl -X POST \
            -H "Content-Type: application/json" \
            @deploy-notification.json \
            ${{ secrets.NOTIFICATION_WEBHOOK_URL }}

      - name: Update version manifest
        run: |
          cat > firmware/VERSION << EOF
          ${{ github.ref_name }}
          EOF

      - name: Create release notes
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Firmware Update - ${{ github.ref_name }}

            Deployed via OTA pipeline.

            **Changes:**
            - Automated signing and deployment
            - HTTPS secure transfer with certificate verification
            - Cryptographic signature verification on device

          files: |
            dist/firmware/update.py
            dist/firmware/VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # PHASE 3: Security Scan (runs on main branch)
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security scanning tools
        run: |
          pip install bandit safety

      - name: Run Bandit (security linter)
        run: |
          bandit -r update_server.py main.py -ll

      - name: Check for vulnerable dependencies
        run: |
          safety check --json > safety-report.json || true
